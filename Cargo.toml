[package]
name = "layout-analysis"
version = "0.1.0"
edition = "2024"
description = "Character n-gram analysis of English text and keyboard layout evaluation / optimization"
license = "MIT"
repository = "https://github.com/ReBot-dev/layout-analysis"
readme = "README.md"
keywords = ["keyboard", "layout", "n-gram", "simulated-annealing"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
